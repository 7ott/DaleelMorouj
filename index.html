<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a513c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مروج CRM">
<title>نظام مروج العقاري</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: CRM shell — side rail (desktop) / bottom bar (phone), work area with a view header and a live body; records open in a side drawer */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --surface-2:#faf8f3; --line:#e4ded1; --line-2:#efeae0;
  --fg:#16221c; --muted:#6a6b5f; --faint:#9a9a8c;
  --accent:#1a513c; --accent-soft:#e7efe9; --on-accent:#f6f4ee;
  --gold:#9a8352; --gold-soft:#f1ecdf;
  --good:#1e7a49; --warn:#b06a00; --danger:#b3261e; --info:#2f5b86;
  --star:#c9a227; --star-off:#d5d8d2;
  --shadow:0 1px 2px rgba(22,34,28,.05),0 4px 14px rgba(22,34,28,.05);
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#151f19; --surface-2:#121b16; --line:#26332b; --line-2:#1e2a23;
  --fg:#e9ede6; --muted:#a2a894; --faint:#6f7667;
  --accent:#7cc39f; --accent-soft:#1b3126; --on-accent:#0e1511;
  --gold:#c8b688; --gold-soft:#2a271c;
  --good:#6fcf97; --warn:#f0b35a; --danger:#f2786e; --info:#7fb0e0;
  --star:#f2bc3a; --star-off:#3a4541;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#151f19; --surface-2:#121b16; --line:#26332b; --line-2:#1e2a23;
  --fg:#e9ede6; --muted:#a2a894; --faint:#6f7667;
  --accent:#7cc39f; --accent-soft:#1b3126; --on-accent:#0e1511;
  --gold:#c8b688; --gold-soft:#2a271c;
  --good:#6fcf97; --warn:#f0b35a; --danger:#f2786e; --info:#7fb0e0;
  --star:#f2bc3a; --star-off:#3a4541;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
a{color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.wa{color:var(--good)}
.btn:disabled{opacity:.55;cursor:default}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px}
.icon:hover{color:var(--accent);background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--muted)) 13%,transparent);color:var(--c,var(--muted))}
.c-good{--c:var(--good)}.c-warn{--c:var(--warn)}.c-danger{--c:var(--danger)}.c-info{--c:var(--info)}.c-accent{--c:var(--accent)}.c-gold{--c:var(--gold)}.c-muted{--c:var(--muted)}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.84rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.seg .n{font-variant-numeric:tabular-nums;opacity:.7;margin-inline-start:3px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:28px 22px;width:min(380px,100%);display:grid;gap:12px;text-align:center}
.lcard .f{text-align:start}
.llogo{width:170px;margin:0 auto;background:#fff;border-radius:10px;padding:8px}
.lcard .sub{color:var(--muted);margin:0}
.err{color:var(--danger);font-size:.88rem;margin:0}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.sbrand{padding:0 6px 14px;border-bottom:2px solid var(--gold-soft);margin-bottom:12px}
.logo{background:#fff;border-radius:10px;padding:8px 12px;border:1px solid var(--line)}
.logo img{display:block;width:100%;max-width:150px;margin:0 auto}
.snav{display:grid;gap:2px}
.snav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:start}
.snav button:hover{background:var(--surface-2);color:var(--fg)}
.snav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.snav svg,.bnav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.sfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 6px 0;border-top:1px solid var(--line-2);font-size:.85rem;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;flex:none;font-family:var(--display)}
.av.lg{width:46px;height:46px;font-size:1.1rem}
.av.t-buyer{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.av.t-owner{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.av.t-trader{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2)}
.tlogo{display:none}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{padding-inline-start:34px;background:var(--surface)}
.gsearch::before{content:"";position:absolute;inset-inline-start:12px;top:50%;width:13px;height:13px;border:2px solid var(--faint);border-radius:50%;transform:translateY(-60%)}
.gres{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:20;padding:6px}
.gres button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.gres .k{font-size:.72rem;color:var(--faint);margin-inline-start:auto;white-space:nowrap}
.gres .empty{padding:14px;color:var(--muted);text-align:center;font-size:.88rem}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--star-off)}
.dot.on{background:var(--good)}
.top .btn.primary{margin-inline-start:auto}

.vhead{padding:20px 24px 8px;display:grid;gap:12px}
.vhead h1{font-size:1.5rem}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vbar input[type=search]{max-width:260px}
.vbar select{width:auto;max-width:180px}
.vbar .grow{flex:1}
#view{padding:8px 24px 40px;min-width:0}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums}
.kpi.alert{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.kpi.alert .v{color:var(--danger)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .more{margin-inline-start:auto;font-family:var(--body);font-size:.8rem;font-weight:500}
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.86rem;cursor:pointer;border-radius:8px}
.frow:hover .fbar i{filter:brightness(1.08)}
.fbar{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden;position:relative}
.fbar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px;min-width:2px;opacity:.85}
.fbar b{position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--fg)}
.frow .fv{text-align:end;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.stack{display:grid;gap:14px;min-width:0}
.mini{display:grid;gap:2px}
.mini .it{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;cursor:pointer}
.mini .it:hover{background:var(--surface-2)}
.mini .it .t{min-width:0;flex:1}
.mini .it .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.mini .it .t span{font-size:.8rem;color:var(--muted)}
.mini .it .r{font-size:.76rem;color:var(--faint);white-space:nowrap}
.bars{display:grid;gap:7px}
.bars .b{display:grid;grid-template-columns:100px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:.84rem}
.bars .b .fbar{height:10px}
.bars .b .n{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin-top:12px}
.note-sm{font-size:.82rem;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--fg);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:.9rem}

/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100dvh - 210px);scroll-snap-align:start}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.colh{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:.9rem}
.colh .n{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.75rem;font-variant-numeric:tabular-nums}
.colh .sum{margin-inline-start:auto;font-size:.74rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.colb{padding:8px;display:grid;gap:8px;overflow-y:auto;min-height:60px;align-content:start}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;display:grid;gap:5px;box-shadow:var(--shadow)}
.dcard:hover{border-color:var(--accent)}
.dcard.dragging{opacity:.45}
.dcard .t{font-weight:600;overflow-wrap:anywhere}
.dcard .p{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.dcard .m{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.76rem;color:var(--muted);align-items:center}
.dcard .v{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.late{color:var(--danger)!important;font-weight:600}
.colempty{font-size:.8rem;color:var(--faint);text-align:center;padding:14px 4px}

/* lists */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sm{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);text-align:end}
.row .end .stack2{display:grid;gap:2px;justify-items:end}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:8px;align-content:start}
.pcard:hover{border-color:var(--accent)}
.pcard .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .code{font-size:.74rem;color:var(--faint);font-variant-numeric:tabular-nums;direction:ltr}
.pcard .t{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.pcard .specs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.pcard .price{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pcard .foot{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line-2);padding-top:8px}
.stars{display:inline-flex;gap:1px;direction:ltr}
.star{background:none;border:0;padding:2px;cursor:pointer;font-size:1.25rem;line-height:1;color:var(--star-off)}
.star.on{color:var(--star)}
.stars.big .star{font-size:1.8rem}
.tgroup h3{font-size:.9rem;color:var(--muted);margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.tgroup:first-child h3{margin-top:0}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.task .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;margin-top:1px;color:transparent;font-size:.8rem;padding:0}
.task .ck:hover{border-color:var(--accent)}
.task.done .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tb{flex:1;min-width:0}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task .tm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:2px}
.task .lnk{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.prio-high{border-inline-start:3px solid var(--danger)}

/* sheets / drawer */
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 38%,transparent);display:flex;justify-content:flex-start}
.panel{background:var(--surface);width:min(460px,100%);height:100vh;height:100dvh;overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start;border-inline-end:1px solid var(--line)}
.panel.wide{width:min(620px,100%);padding:0;display:flex;flex-direction:column;overflow:hidden}
.panel h2{font-size:1.2rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;grid-column:1/-1;min-width:0}
.f.half{grid-column:auto}
.fsec{grid-column:1/-1;font-family:var(--display);font-size:.9rem;color:var(--gold);border-top:1px solid var(--line-2);padding-top:10px;margin-top:4px}
.fcheck{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:.88rem;background:var(--accent-soft);padding:10px 12px;border-radius:9px}
.fcheck input{width:auto}
.factions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
.dscroll{flex:1;overflow:auto;padding:0 20px 20px}
.dhead{position:sticky;top:0;background:var(--surface);z-index:2;padding:18px 0 12px;display:grid;gap:10px;border-bottom:1px solid var(--line-2)}
.dtop{display:flex;align-items:flex-start;gap:12px}
.dtop .ttl{flex:1;min-width:0}
.dtop h2{overflow-wrap:anywhere}
.dtop .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.dacts{display:flex;flex-wrap:wrap;gap:6px}
.dsec{padding-top:16px}
.dsec > h3{font-size:.88rem;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dsec > h3 .btn{margin-inline-start:auto}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.dl div{background:var(--surface);padding:8px 12px;min-width:0}
.dl dt{font-size:.74rem;color:var(--faint)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.dl .wide2,.dl div:last-child:nth-child(odd){grid-column:1/-1}
.rel{display:grid;gap:6px}
.relit{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface)}
.relit:hover{border-color:var(--accent)}
.relit .t{flex:1;min-width:0}
.relit .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.relit .t span{font-size:.78rem;color:var(--muted)}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:2px 0 4px}
.step{flex:1 0 auto;border:0;padding:7px 10px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:6px;position:relative}
.step.done{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.step.cur{background:var(--accent);color:var(--on-accent)}
.step.won.cur{background:var(--good)}
.step.lost.cur{background:var(--danger);color:#fff}
.step:hover:not(.cur){filter:brightness(.96)}

/* ---------- data ---------- */
async function loadTable(t){const out=[];let from=0;for(;;){const{data,error}=await S.sb.from(t).select("*").range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}S.data[t]=new Map(out.map(r=>[r.id,r]))}
async function loadAll(){try{await Promise.all(TABLES.map(loadTable));S.loadErr=null}catch(e){console.error(e);S.loadErr=e}S.ready=true;renderAll()}
let rq;function schedule(){clearTimeout(rq);rq=setTimeout(renderAll,40)}
function upsertLocal(t,r){if(r&&r.id){S.data[t].set(r.id,r);schedule()}}
function removeLocal(t,id){S.data[t].delete(id);schedule()}
async function ins(t,row){const{data,error}=await S.sb.from(t).insert({...row,created_by:S.me}).select().single();if(error)throw error;upsertLocal(t,data);return data}
async function upd(t,id,patch){const{data,error}=await S.sb.from(t).update(patch).eq("id",id).select().single();if(error)throw error;upsertLocal(t,data);return data}
async function del(t,id){const{error}=await S.sb.from(t).delete().eq("id",id);if(error)throw error;removeLocal(t,id)}
async function logAct(o){try{return await ins("activities",o)}catch(e){console.error(e)}}
function users(){const u=new Set([S.me]);["contacts","deals","tasks"].forEach(t=>all(t).forEach(r=>{if(r.assigned_to)u.add(r.assigned_to);if(r.created_by)u.add(r.created_by)}));u.delete("");return[...u].sort()}
function areas(){const a=new Set();all("contacts").forEach(r=>r.area&&a.add(r.area));all("properties").forEach(r=>r.area&&a.add(r.area));all("offices").forEach(r=>r.area&&a.add(r.area));return[...a].sort((x,y)=>x.localeCompare(y,"ar"))}

/* ---------- indexes (rebuilt every render) ---------- */
let IX={};
function buildIndex(){
  const deals=all("deals"),acts=all("activities"),tasks=all("tasks");
  const dealsByBuyer={},lastC={},lastD={},nextC={},nextD={},openTasks={c:{},d:{}};
  deals.forEach(d=>{if(d.buyer_id)(dealsByBuyer[d.buyer_id]=dealsByBuyer[d.buyer_id]||[]).push(d)});
  const dBuyer=Object.fromEntries(deals.map(d=>[d.id,d.buyer_id]));
  acts.forEach(a=>{const cid=a.contact_id||dBuyer[a.deal_id];if(cid&&(!lastC[cid]||a.created_at>lastC[cid]))lastC[cid]=a.created_at;if(a.deal_id&&a.kind!=="system"&&(!lastD[a.deal_id]||a.created_at>lastD[a.deal_id]))lastD[a.deal_id]=a.created_at});
  tasks.forEach(t=>{if(t.done)return;const cid=t.contact_id||dBuyer[t.deal_id];const k=t.due_at||"9999";if(cid&&(!nextC[cid]||k<(nextC[cid].due_at||"9999")))nextC[cid]=t;if(t.deal_id&&(!nextD[t.deal_id]||k<(nextD[t.deal_id].due_at||"9999")))nextD[t.deal_id]=t});
  IX={dealsByBuyer,lastC,lastD,nextC,nextD};
}

/* ---------- matching ---------- */
function score(c,p){
  if(p.status!=="available")return-99;let s=0;
  if(c.prop_type){if(p.prop_type&&p.prop_type!==c.prop_type)return-99;if(p.prop_type===c.prop_type)s+=3}
  if(c.budget_max&&p.price){if(p.price>c.budget_max*1.1)return-99;s+=2}
  if(c.budget_min&&p.price&&p.price<c.budget_min*.6)s-=1;
  const ar=(c.pref_areas||c.area||"").split(/[,،\n]/).map(norm).filter(Boolean);
  if(ar.length&&p.area){const pa=norm(p.area);if(ar.some(a=>pa.includes(a)||a.includes(pa)))s+=3;else s-=2}
  if(c.rooms&&p.rooms){if(p.rooms<c.rooms)s-=2;else s+=1}
  return s;
}
const hasNeeds=c=>c.type==="buyer"&&(c.prop_type||c.budget_max||c.pref_areas||c.area);
const matchesFor=c=>hasNeeds(c)?all("properties").map(p=>[p,score(c,p)]).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]):[];
const buyersFor=p=>all("contacts").filter(hasNeeds).map(c=>[c,score(c,p)]).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);

/* ---------- navigation ---------- */
function navHTML(mobile){const late=all("tasks").filter(isLate).length;return NAV.map(([k,l,sl])=>`<button type="button" data-act="view" data-arg="${k}"${S.view===k?' aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg><span>${mobile?sl:l}</span>${k==="tasks"&&late?`<span class="badge">${late}</span>`:""}</button>`).join("")}
function go(v){if(!TITLES[v])v="dashboard";S.view=v;try{history.replaceState(null,"","#"+v)}catch{}$("viewTitle").textContent=TITLES[v];$("bar").innerHTML=BARS[v]?BARS[v]():"";bindBar(v);renderAll();window.scrollTo(0,0)}

/* ---------- render ---------- */
function renderAll(){
  if(!S.live)return;
  buildIndex();
  $("snav").innerHTML=navHTML(false);$("bnav").innerHTML=navHTML(true);
  let h;
  if(!S.ready)h=`<div class="empty"><strong>جاري تحميل البيانات…</strong>ثواني وكل حاجة هتظهر.</div>`;
  else{h=(S.loadErr?`<div class="banner">فيه جداول ناقصة في قاعدة البيانات. افتح Supabase ← SQL Editor وشغّل ملف <b>crm-setup.sql</b> مرة واحدة، وبعدين اعمل Refresh.</div>`:"")+(VIEWS[S.view]||VIEWS.dashboard)()}
  $("view").innerHTML=h;
  refreshBarCounts();
  if(S.detail){if(!get(S.detail.t,S.detail.id))closeDetail();else renderDetail()}
}

function bindBar(v){
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn)};
  const segs=(id,attr,key,num)=>on(id,"click",e=>{const b=e.target.closest("button");if(!b)return;S.f[key]=num?+b.dataset[attr]:b.dataset[attr];$(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderAll()});
  if(v==="pipeline"){on("fq","input",e=>{S.f.pq=e.target.value;renderAll()});on("fus","change",e=>{S.f.pu=e.target.value;renderAll()});on("fsrc","change",e=>{S.f.ps=e.target.value;renderAll()})}
  if(v==="contacts"){segs("ctype","t","ct");on("fq","input",e=>{S.f.cq=e.target.value;renderAll()});on("ftemp","change",e=>{S.f.cte=e.target.value;renderAll()});on("fsrc","change",e=>{S.f.cs=e.target.value;renderAll()});on("fsort","change",e=>{S.f.cso=e.target.value;renderAll()});if(S.f.cso)$("fsort").value=S.f.cso}
  if(v==="properties"){segs("pstat","s","pst");on("fq","input",e=>{S.f.pq2=e.target.value;renderAll()});on("fptype","change",e=>{S.f.ppt=e.target.value;renderAll()});on("farea","change",e=>{S.f.par=e.target.value;renderAll()});on("fmax","input",e=>{S.f.pmax=e.target.value;renderAll()})}
  if(v==="tasks")segs("tscope","s","ts");
  if(v==="offices"){segs("orate","r","or",true);on("fq","input",e=>{S.f.oq=e.target.value;renderAll()});on("farea","change",e=>{S.f.oar=e.target.value;renderAll()})}
}
function refreshBarCounts(){
  document.querySelectorAll("#ctype [data-cnt]").forEach(el=>{const k=el.dataset.cnt;el.textContent=all("contacts").filter(c=>!k||c.type===k).length});
  document.querySelectorAll("#pstat [data-cnt]").forEach(el=>{const k=el.dataset.cnt;el.textContent=all("properties").filter(p=>!k||p.status===k).length});
}

const VIEWS={};
VIEWS.dashboard=()=>{
  const deals=all("deals"),contacts=all("contacts"),tasks=all("tasks"),acts=all("activities");
  const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
  const open=deals.filter(d=>OPEN.includes(d.stage));
  const wonM=deals.filter(d=>d.stage==="won"&&new Date(d.won_at||d.updated_at)>=m0);
  const newC=contacts.filter(c=>new Date(c.created_at)>=m0);
  const late=tasks.filter(isLate);

  const closedM=deals.filter(d=>(d.stage==="won"||d.stage==="lost")&&new Date(d.updated_at)>=m0);

    <div class="kpi"><span class="l">صفقات مفتوحة</span><span class="v">${open.length}</span><span class="s">بقيمة ${short(sum(open,"value"))||0} ج.م</span></div>
    <div class="kpi"><span class="l">مبيعات الشهر ده</span><span class="v">${wonM.length}</span><span class="s">${wonM.length?short(sum(wonM,"value"))+" ج.م":"لسه مفيش"}</span></div>
    <div class="kpi"><span class="l">عمولات الشهر</span><span class="v">${short(sum(wonM,"commission"))}</span><span class="s">ج.م${rate!==null?` · نسبة الإغلاق ${rate}%`:""}</span></div>
    <div class="kpi"><span class="l">عملاء جدد الشهر ده</span><span class="v">${newC.length}</span><span class="s">${contacts.filter(c=>c.type==="buyer").length} مشتري · ${contacts.filter(c=>c.type==="owner").length} مالك</span></div>
    <div class="kpi${late.length?" alert":""}" data-act="view" data-arg="tasks" style="cursor:pointer"><span class="l">متابعات متأخرة</span><span class="v">${late.length}</span><span class="s">${tasks.filter(t=>!t.done&&t.due_at&&dayDiff(t.due_at)===0).length} النهاردة</span></div>
  </div>`;
  const maxN=Math.max(1,...OPEN.concat("won").map(k=>deals.filter(d=>d.stage===k).length));
  const funnel=OPEN.concat("won").map(k=>{const ds=deals.filter(d=>d.stage===k);return`<div class="frow" data-act="view" data-arg="pipeline"><span>${STAGE[k].l}</span><div class="fbar"><i class="c-${STAGE[k].c}" style="width:${ds.length/maxN*100}%;background:var(--c)"></i><b>${ds.length}</b></div><span class="fv">${sum(ds,"value")?short(sum(ds,"value")):"—"}</span></div>`}).join("");
  const due=tasks.filter(t=>!t.done&&t.due_at&&dayDiff(t.due_at)<=0).sort((a,b)=>a.due_at.localeCompare(b.due_at)).slice(0,7);
  const now=Date.now();
  const stale=open.filter(d=>{const l=IX.lastD[d.id]||d.stage_changed_at||d.created_at;return now-new Date(l)>7*864e5}).slice(0,6);
  const recent=acts.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,8);
  const srcMap={};contacts.forEach(c=>{const s=c.source||"غير محدد";srcMap[s]=(srcMap[s]||0)+1});
  const src=Object.entries(srcMap).sort((a,b)=>b[1]-a[1]).slice(0,6);const srcMax=Math.max(1,...src.map(x=>x[1]));

function actMini(a){

  return`<div class="it"${tgt?` data-act="open" data-arg="${tgt[0]}:${tgt[1]}"`:""}><span class="tico k-${a.kind}" style="width:24px;height:24px;font-size:.72rem">${KIND_ICO[a.kind]||"•"}</span><div class="t"><b>${esc(tgt?tgt[2]:"—")}</b><span>${esc(KINDS[a.kind]||"")}${KINDS[a.kind]?": ":""}${esc((a.body||"").slice(0,90))}</span></div><span class="r">${ago(a.created_at)}</span></div>`;

VIEWS.pipeline=()=>{
  const q=norm(S.f.pq);
  const deals=all("deals").filter(d=>{if(S.f.pu&&d.assigned_to!==S.f.pu)return false;if(S.f.ps&&d.source!==S.f.ps)return false;if(q){const b=get("contacts",d.buyer_id),p=get("properties",d.property_id);if(!norm([dealTitle(d),b&&b.phone,p&&p.code,p&&p.area].join(" ")).includes(q))return false}return true});
  if(!all("deals").length)return`<div class="empty"><strong>لسه مفيش صفقات</strong>كل مشتري جديد بتضيفه بيتفتحله صفقة تلقائي في أول مرحلة، وتقدر تحركها لحد "تم البيع".<br><button class="btn primary" type="button" data-act="new" data-arg="deals">+ صفقة جديدة</button></div>`;
  const now=Date.now();
  return`<p class="note-sm" style="margin:0 0 10px">اسحب الكارت لمرحلة تانية، أو افتحه وغيّر المرحلة من فوق.</p><div class="board" id="board">${STAGES.map(s=>{
    const ds=deals.filter(d=>d.stage===s.k).sort((a,b)=>(b.updated_at||"").localeCompare(a.updated_at||""));
    const tot=ds.reduce((a,d)=>a+(Number(d.value)||0),0);
    return`<section class="col" data-stage="${s.k}"><div class="colh">${dotc(s.c)}<span>${s.l}</span><span class="n">${ds.length}</span><span class="sum">${tot?short(tot):""}</span></div><div class="colb">${ds.length?ds.map(d=>{
      const b=get("contacts",d.buyer_id),p=get("properties",d.property_id),nt=IX.nextD[d.id];
      const days=Math.floor((now-new Date(d.stage_changed_at||d.created_at))/864e5);
      return`<article class="dcard" draggable="true" data-deal="${d.id}" data-act="open" data-arg="deals:${d.id}">
        <div class="t">${esc(b?b.name:dealTitle(d))}</div>
        ${p?`<div class="p">${esc(p.title)}${p.area?" · "+esc(p.area):""}</div>`:b&&hasNeeds(b)?`<div class="p">يدور على: ${esc([b.prop_type,budget(b)].filter(Boolean).join(" · "))}</div>`:""}
        <div class="m">${d.value?`<span class="v">${short(d.value)}</span>`:""}${b&&b.temp?chip(TEMPS[b.temp],TEMP_C[b.temp]):""}${nt?`<span class="${isLate(nt)?"late":""}">⏰ ${dueTxt(nt.due_at)}</span>`:(OPEN.includes(d.stage)?`<span class="late">بدون متابعة</span>`:"")}${OPEN.includes(d.stage)&&days>0?`<span>${days} يوم هنا</span>`:""}${d.stage==="lost"&&d.lost_reason?`<span>${esc(d.lost_reason)}</span>`:""}</div>
      </article>`}).join(""):`<div class="colempty">اسحب صفقة هنا</div>`}</div></section>`}).join("")}</div>`;
};

function contactRow(c){
  const last=IX.lastC[c.id],nt=IX.nextC[c.id];
  let sub=[];
  if(c.type==="buyer"){if(c.prop_type)sub.push(c.prop_type);const bg=budget(c);if(bg)sub.push(bg);if(c.pref_areas||c.area)sub.push(c.pref_areas||c.area)}

VIEWS.tasks=()=>{

async function moveStage(id,to,reason){
  const d=get("deals",id);if(!d||d.stage===to)return;
  if(to==="lost"&&!reason){if(!S.detail||S.detail.id!==id)openDetail("deals",id);S.askLost=true;renderDetail();return}
  const from=d.stage,buyer=d.buyer_id||null,prop=d.property_id||null;
  const now=new Date().toISOString(),patch={stage:to,stage_changed_at:now};
  if(to==="won")patch.won_at=now;if(to==="lost")patch.lost_reason=reason;
  try{
    await upd("deals",id,patch);
    await logAct({kind:"stage",body:`من «${STAGE[from]?STAGE[from].l:from}» إلى «${STAGE[to].l}»${reason?` — السبب: ${reason}`:""}`,deal_id:id,contact_id:buyer,property_id:prop});
    await syncProperty(prop,to);
    toast(to==="won"?"مبروك! الصفقة اتقفلت 🎉":`الصفقة اتنقلت لـ ${STAGE[to].l}`);
  }catch(e){fail(e)}
}
async function syncProperty(pid,stage){
  const p=get("properties",pid);if(!p)return;
  let st=null;if(stage==="reserved"||stage==="contract")st="reserved";else if(stage==="won")st="sold";else if(stage==="lost"&&p.status==="reserved")st="available";
  if(st&&st!==p.status){try{await upd("properties",pid,{status:st});await logAct({kind:"system",body:`حالة الوحدة بقت «${PSTATUS[st]}»`,property_id:pid})}catch(e){console.error(e)}}
}

async function confirmDel(btn,arg){
  if(!btn.dataset.armed){btn.dataset.armed="1";btn.textContent="اضغط تاني للتأكيد";setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent="حذف"}},4000);return}

}

function fieldHTML(f,v){
  const show=f.show?` data-show="${f.show.join(" ")}"`:"";

  const id="f_"+f.k,val=v===undefined||v===null?(f.def??""):v;let input;
  switch(f.t){
    case"select":input=`<select id="${id}"><option value="">—</option>${opts(f.o).map(([k,l])=>`<option value="${esc(k)}"${String(val)===String(k)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;break;
    case"rel":{const rows=all(f.rel).filter(f.filter||(()=>true)).sort((a,b)=>labelOf(f.rel,a).localeCompare(labelOf(f.rel,b),"ar"));input=`<select id="${id}"><option value="">—</option>${rows.map(r=>`<option value="${r.id}"${val===r.id?" selected":""}>${esc(labelOf(f.rel,r))}</option>`).join("")}</select>`;break}
    case"area":input=`<textarea id="${id}" rows="3">${esc(val)}</textarea>`;break;
    case"money":case"num":case"int":input=`<input id="${id}" inputmode="${f.t==="int"?"numeric":"decimal"}" dir="ltr" value="${esc(f.t==="money"&&val!==""?Number(val).toLocaleString("en-US"):val)}"${f.t==="money"?' placeholder="0"':""}>`;break;
    case"date":input=`<input id="${id}" type="date" value="${esc(val?String(val).slice(0,10):"")}">`;break;
    case"datetime":input=`<input id="${id}" type="datetime-local" value="${esc(val?toLocalInput(val):"")}">`;break;
    case"tel":input=`<input id="${id}" type="tel" inputmode="tel" dir="ltr" value="${esc(val)}">`;break;
    case"stars":return`<div class="f"><span>${f.l}</span><div class="stars big" id="${id}" data-v="${val||0}">${[1,2,3,4,5].map(i=>`<button type="button" class="star${i<=(val||0)?" on":""}" data-fs="${i}" aria-label="${i} نجوم">★</button>`).join("")}</div></div>`;
    default:input=`<input id="${id}" value="${esc(val)}"${f.list?` list="dl_${f.list}"`:""}${f.ph?` placeholder="${esc(f.ph)}"`:""}>`;
  }
  return`<label class="f${f.half?" half":""}"${show}><span>${f.l}${f.req?" *":""}</span>${input}</label>`;
}

  const res=[];
  all("contacts").forEach(c=>{if(norm([c.name,c.phone,c.phone2].join(" ")).includes(q))res.push(["contacts",c.id,c.name,TYPES[c.type]])});
  all("properties").forEach(p=>{if(norm([p.title,p.code,p.area].join(" ")).includes(q))res.push(["properties",p.id,p.title,"وحدة"+(p.code?" "+p.code:"")])});
  all("deals").forEach(d=>{if(norm(dealTitle(d)).includes(q))res.push(["deals",d.id,dealTitle(d),"صفقة · "+STAGE[d.stage].l])});
  all("offices").forEach(o=>{if(norm([o.name,o.phone].join(" ")).includes(q))res.push(["offices",o.id,o.name,"مكتب"])});
  box.innerHTML=res.length?res.slice(0,12).map(r=>`<button type="button" data-act="open" data-arg="${r[0]}:${r[1]}"><span>${esc(r[2])}</span><span class="k">${esc(r[3])}</span></button>`).join(""):`<div class="empty" style="border:0;padding:14px">مفيش نتائج لـ "${esc($("gq").value)}"</div>`;box.hidden=false;
});
$("gq").addEventListener("keydown",e=>{if(e.key==="Escape"){$("gq").value="";$("gres").hidden=true}});
document.addEventListener("click",e=>{if(!e.target.closest(".gsearch"))$("gres").hidden=true});

/* ===== drag & drop on board ===== */
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".dcard");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.deal);e.dataTransfer.effectAllowed="move";c.classList.add("dragging")});
document.addEventListener("dragend",e=>{const c=e.target.closest&&e.target.closest(".dcard");if(c)c.classList.remove("dragging");document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"))});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col)return;e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");if(id)moveStage(id,col.dataset.stage)});

/* ===== import ===== */
const IMP_COLS={buyer:"الاسم، الموبايل، المنطقة، الميزانية، ملاحظات",owner:"الاسم، الموبايل، المنطقة، ملاحظات",trader:"الاسم، الموبايل، المنطقة، ملاحظات",offices:"الاسم، المنطقة، الموبايل، التقييم (1-5)، ملاحظات"};
function impHint(){$("impCols").innerHTML="كل سطر = عنصر، والأعمدة بالترتيب ده: <b>"+IMP_COLS[$("impTarget").value]+"</b>. الأعمدة بعد الاسم اختيارية.";impPreview()}
function parseCSV(text){return text.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const sep=l.includes("\t")?"\t":(l.includes(";")&&!l.includes(",")?";":",");const cells=[];let cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){cells.push(cur);cur=""}else cur+=c}cells.push(cur);return cells.map(c=>c.trim())}).filter(c=>c[0]&&!/^(الاسم|اسم المكتب|اسم|name)$/i.test(c[0]))}
function impRows(){const tg=$("impTarget").value,rows=parseCSV($("impText").value);
  if(tg==="offices")return rows.map(([name,area,phone,rating,...n])=>{let r=parseInt(toLat(rating||""),10);if(!(r>=1&&r<=5))r=0;return{name,area:area||"",phone:phone||"",rating:r,notes:n.join(" ")}});
  return rows.map(([name,phone,area,a4,...n])=>{const o={type:tg,name,phone:phone||null,area:area||null,assigned_to:S.me,source:null};if(tg==="buyer"){const b=Number(toLat(a4||"").replace(/[^\d]/g,""));if(b)o.budget_max=b;o.notes=n.join(" ")||null}else o.notes=[a4,...n].filter(Boolean).join(" ")||null;return o})}
function impPreview(){const n=impRows().length;$("impInfo").textContent=n?`هيتم استيراد ${n} سطر.`:""}
$("impTarget").addEventListener("change",impHint);$("impText").addEventListener("input",impPreview);
$("impFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("impText").value=rd.result;impPreview()};rd.readAsText(f,"utf-8")});
$("impForm").addEventListener("submit",async e=>{
  e.preventDefault();const tg=$("impTarget").value,t=tg==="offices"?"offices":"contacts";let rows=impRows();
  if(!rows.length){$("impInfo").textContent="مفيش سطور صالحة. أول عمود لازم يكون الاسم.";return}
  const key=r=>norm(r.name)+"|"+norm(toLat(r.phone||"").replace(/\D/g,""));const ex=new Set(all(t).map(key));const before=rows.length;rows=rows.filter(r=>!ex.has(key(r)));
  $("impGo").disabled=true;let done=0;
  try{for(let i=0;i<rows.length;i+=300){const chunk=rows.slice(i,i+300).map(r=>({...r,created_by:S.me}));const{data,error}=await S.sb.from(t).insert(chunk).select();if(error)throw error;(data||[]).forEach(r=>S.data[t].set(r.id,r));done+=chunk.length;$("impInfo").textContent=`جاري الاستيراد… ${done} / ${rows.length}`}
    schedule();$("impSheet").hidden=true;toast(`اتضاف ${rows.length}`+(before-rows.length?` (${before-rows.length} مكرر اتجاهل)`:""));
  }catch(err){fail(err);$("impInfo").textContent=`اتضاف ${done} قبل ما يحصل خطأ.`}finally{$("impGo").disabled=false}
});

/* ===== export ===== */
function exportCSV(t){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;let head,rows;
  if(t==="contacts"){head=["النوع","الاسم","الموبايل","موبايل 2","المنطقة","المصدر","الاهتمام","المسؤول","نوع الوحدة","الميزانية من","الميزانية إلى","المناطق المفضلة","ملاحظات","تاريخ الإضافة"];rows=all("contacts").map(c=>[TYPES[c.type],c.name,c.phone,c.phone2,c.area,c.source,TEMPS[c.temp]||"",c.assigned_to,c.prop_type,c.budget_min,c.budget_max,c.pref_areas,c.notes,dfmt(c.created_at)])}
  else if(t==="properties"){head=["الكود","الوحدة","النوع","الحالة","المنطقة","المساحة","الغرف","السعر","المالك","ملاحظات"];rows=all("properties").map(p=>[p.code,p.title,p.prop_type,PSTATUS[p.status],p.area,p.size,p.rooms,p.price,(get("contacts",p.owner_id)||{}).name,p.notes])}
  else if(t==="deals"){head=["الصفقة","المرحلة","المشتري","الموبايل","الوحدة","القيمة","العمولة","المصدر","المسؤول","سبب الخسارة","تاريخ الفتح"];rows=all("deals").map(d=>{const b=get("contacts",d.buyer_id)||{};return[dealTitle(d),STAGE[d.stage].l,b.name,b.phone,(get("properties",d.property_id)||{}).title,d.value,d.commission,d.source,d.assigned_to,d.lost_reason,dfmt(d.created_at)]})}
  else{head=["الاسم","المنطقة","الموبايل","التقييم","المسؤول","الحالة","ملاحظات"];rows=all("offices").map(o=>[o.name,o.area,o.phone,o.rating||"",o.contact,o.status,o.notes])}
  const csv="﻿"+[head,...rows].map(r=>r.map(q).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`مروج-${TITLES[t==="deals"?"pipeline":t]||t}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("اتنزل الملف");
}

/* ===== global click router ===== */
document.addEventListener("click",e=>{
  if(e.target.closest("a[href]"))return;
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,arg=a.dataset.arg||"";
  switch(act){
    case"view":closeDetail();go(arg);break;
    case"open":{const [t,id]=arg.split(":");$("gres").hidden=true;$("gq").value="";openDetail(t,id);break}
    case"new":openForm(arg,null,a.dataset.preset?JSON.parse(a.dataset.preset):{});break;
    case"newcontact":openForm("contacts",null,{type:S.f.ct||"buyer"});break;
    case"edit":{const [t,id]=arg.split(":");openForm(t,get(t,id));break}
    case"stage":{const [id,st]=arg.split(":");moveStage(id,st);break}
    case"lost":moveStage(S.detail.id,"lost",$("lostReason").value).then(()=>{S.askLost=false;renderDetail()});break;
    case"nolost":S.askLost=false;renderDetail();break;
    case"task":toggleTask(arg);break;
    case"star":{const [id,v]=arg.split(":");rate(id,+v);break}
    case"del":confirmDel(a,arg);break;
    case"close":closeDetail();break;
    case"quick":$("quick").hidden=false;break;
    case"closeq":$("quick").hidden=true;break;
    case"closeform":closeForm();break;
    case"import":$("quick").hidden=true;$("impText").value="";$("impInfo").textContent="";$("impTarget").value=S.view==="offices"?"offices":(S.f.ct||"buyer");impHint();$("impSheet").hidden=false;break;
    case"closeimp":$("impSheet").hidden=true;break;
    case"export":exportCSV(arg);break;
    case"logout":S.sb.auth.signOut();break;
  }
});
["detail","formSheet","quick","impSheet"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target.id===id){if(id==="detail")closeDetail();else if(id==="formSheet")closeForm();else $(id).hidden=true}}));
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("formSheet").hidden)closeForm();else if(!$("impSheet").hidden)$("impSheet").hidden=true;else if(!$("quick").hidden)$("quick").hidden=true;else if(!$("detail").hidden)closeDetail()});

window.addEventListener("hashchange",()=>{const h=(location.hash||"").slice(1);if(S.live&&TITLES[h]&&h!==S.view){closeDetail();go(h)}});

/* ===== realtime ===== */
function subscribe(){
  if(S.channel)S.sb.removeChannel(S.channel);
  let ch=S.sb.channel("crm-live");
  TABLES.forEach(t=>{ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},p=>{if(p.eventType==="DELETE"){if(p.old&&p.old.id)removeLocal(t,p.old.id)}else upsertLocal(t,p.new)})});
  S.channel=ch.subscribe(st=>{if(st==="SUBSCRIBED"){setSync(true,"متزامن");loadAll()}else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED")setSync(false,"بيعيد الاتصال…")});
}

/* ===== auth ===== */
function loginMsg(t){$("loginErr").textContent=t;$("loginErr").hidden=false}
function showApp(on){$("app").hidden=!on;$("login").hidden=on}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("loginErr").hidden=true;
  if(!S.sb){loginMsg(S.bootErr||"الاتصال بقاعدة البيانات مش شغال.");return}
  $("loginBtn").disabled=true;$("loginBtn").textContent="جاري الدخول…";
  const u=toLat($("lEmail").value).trim().toLowerCase(),email=u.includes("@")?u:u+"@"+LOGIN_DOMAIN;
  let error;try{({error}=await S.sb.auth.signInWithPassword({email,password:$("lPass").value}))}catch(err){error={message:String(err&&err.message||err)}}
  $("loginBtn").disabled=false;$("loginBtn").textContent="دخول";if(!error)return;
  console.error("login error:",error);const m=String(error.message||"").toLowerCase(),code=String(error.code||"");
  if(code==="email_not_confirmed"||m.includes("not confirmed"))loginMsg("المستخدم موجود بس مش متفعّل. في Supabase ← Authentication ← Users اضغط على المستخدم واختار Confirm.");
  else if(code==="invalid_credentials"||m.includes("invalid login"))loginMsg("اسم المستخدم أو كلمة المرور غلط، أو المستخدم لسه متعملش في Supabase (لازم إيميله يكون "+email+").");
  else if(m.includes("api key")||m.includes("apikey")||error.status===401)loginMsg("الـ key المكتوب في index.html غلط. انسخه تاني من Supabase ← Project Settings ← API Keys.");
  else if(m.includes("fetch")||m.includes("network")||m.includes("failed"))loginMsg("مش قادر يوصل لـ Supabase. اتأكد من النت وإن المشروع مش متوقف (Paused).");
  else loginMsg("حصل خطأ: "+error.message);
});

try{if(typeof supabase==="undefined")throw new Error("lib");S.sb=supabase.createClient(new URL(SUPABASE_URL.trim()).origin,SUPABASE_ANON_KEY.trim())}
catch(err){console.error(err);showApp(false);S.bootErr=err.message==="lib"?"مكتبة Supabase ماتحمّلتش. اتأكد من النت واعمل Refresh.":"الـ Project URL في index.html شكله غلط.";loginMsg(S.bootErr);return}
S.sb.auth.onAuthStateChange((_ev,session)=>{
  if(session){if(S.live)return;S.live=true;S.me=String((session.user&&session.user.email)||"").split("@")[0];$("meName").textContent=S.me;$("meAv").textContent=initials(S.me).toUpperCase();showApp(true);setSync(false,"جاري الاتصال…");const h=(location.hash||"").slice(1);go(TITLES[h]?h:"dashboard");subscribe()}
  else{S.live=false;S.ready=false;if(S.channel){S.sb.removeChannel(S.channel);S.channel=null}TABLES.forEach(t=>S.data[t]=new Map());closeDetail();showApp(false)}
});
})();
</script>
